<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公益AI中转站 · 自动签到台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1220;color:#e6e8f0;display:flex;height:100vh;overflow:hidden}
#app{display:flex;width:100%}
/* 侧栏 */
.side{width:180px;background:#161a2e;padding:18px 10px;display:flex;flex-direction:column;gap:6px;border-right:1px solid #252a45}
.side .logo{font-size:16px;font-weight:700;color:#8ab4ff;margin:0 8px 14px}
.tab{padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:#9aa3bf;display:flex;gap:8px;align-items:center}
.tab.on{background:#1f2550;color:#fff}
.tab:hover{color:#fff}
/* 主区 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid #252a45}
.top h2{font-size:17px}
.badge{font-size:12px;background:#1f2550;padding:4px 10px;border-radius:10px;color:#8ab4ff}
.body{flex:1;padding:20px 24px;overflow-y:auto}
/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.card{background:#161a2e;border:1px solid #252a45;border-radius:12px;padding:14px}
.card .lbl{font-size:12px;color:#8a90b8}
.card .val{font-size:22px;font-weight:700;margin-top:4px}
.ok{color:#6bdf85}.warn{color:#ffc857}.err{color:#ff7a7a}
/* 矩阵 */
.matrix{background:#161a2e;border:1px solid #252a45;border-radius:12px;padding:14px}
.matrix h3{font-size:14px;color:#8a90b8;margin-bottom:10px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #202445;font-size:13px}
.row:last-child{border:none}
.chip{padding:3px 8px;border-radius:6px;font-size:11px}
.chip.a{background:#1f3a1f;color:#6bdf85}.chip.b{background:#3a2f1f;color:#ffc857}.chip.c{background:#3a1f1f;color:#ff7a7a}
.btn{padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-size:12px;background:#2a3168;color:#fff}
.btn:hover{background:#3a4388}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.warn{background:#6b5420}.btn.danger{background:#6b2020}
textarea,input,select{background:#0f1220;border:1px solid #252a45;color:#e6e8f0;padding:7px 10px;border-radius:8px;font-size:13px;width:100%}
form .f{margin-bottom:10px}
form label{display:block;font-size:12px;color:#8a90b8;margin-bottom:4px}
.log{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;background:#0c0e1a;border:1px solid #252a45;border-radius:10px;padding:12px;max-height:400px;overflow-y:auto;line-height:1.6}
.log .t{color:#8a90b8}.log .e{color:#8ab4ff}
.hidden{display:none}
.authstat{margin-top:8px;padding:8px 10px;background:#0c0e1a;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div class="side">
    <div class="logo">🎓 justsign</div>
    <div class="tab on" data-tab="home">📊 首页总览</div>
    <div class="tab" data-tab="accounts">👤 账号</div>
    <div class="tab" data-tab="sites">🌐 站点</div>
    <div class="tab" data-tab="logs">📝 日志 & 设置</div>
    <div class="tab" data-tab="settings">⚙️ 引擎设置</div>
  </div>
  <div class="main">
    <div class="top"><h2 id="title">首页总览</h2>
      <div><button class="btn sm" id="btnRefreshAll">🔄 刷新全部余额</button> <span class="badge" id="proxyBadge">代理: 检测中</span> <span class="badge" id="schBadge">调度: 关</span></div>
    </div>

    <!-- HOME -->
    <div class="body" id="tab-home">
      <div class="grid">
        <div class="card"><div class="lbl">账号总数</div><div class="val" id="sumAc">-</div></div>
        <div class="card"><div class="lbl">站点总数</div><div class="val" id="sumSite">-</div></div>
        <div class="card"><div class="lbl">已登录</div><div class="val ok" id="sumLogin">-</div></div>
      </div>
      <div class="grid" id="quotaGrid"></div>
      <div class="matrix">
        <h3>账号 × 站点 登录状态矩阵</h3>
        <div id="matrix"></div>
      </div>
    </div>

    <!-- ACCOUNTS -->
    <div class="body hidden" id="tab-accounts">
        <div class="matrix">
        <h3>添加账号（GitHub 账号 + 站点）</h3>
        <div id="authPanel" style="display:block;margin-bottom:12px;padding:10px;background:#1f2550;border-radius:10px;font-size:13px">
          <span id="authEnv">🐍 Python 引擎(Scrapling)</span> 内置授权:
          <button class="btn" id="btnAuth" style="margin-left:6px">🔑 全自动授权(headless)</button>
          <button class="btn warn" id="btnAuthManual" style="margin-left:6px">🖥️ 手动登录授权(弹浏览器)</button>
          <span class="lbl" style="margin-left:8px">全自动=凭据库填账密/2FA 一键完成;手动=自己输密码(不存密码,仅存会话)</span>
          <div class="authstat hidden" id="authStat"></div>
        </div>
        <form id="addForm">
          <div class="f"><label>账号别名</label><input id="aKey" placeholder="gh1"></div>
          <div class="f"><label>GitHub 账号名</label><input id="aGh" placeholder="AI模型API"></div>
          <div class="f"><label>绑定站点</label><select id="aSite"></select></div>
          <div class="f"><label>access_token（用真实浏览器授权一次后粘贴,可留空走授权）</label><input id="aToken" placeholder="Bearer 后的 access_token"></div>
          <button class="btn" type="submit">保存账号</button>
        </form>
      </div>
      <div class="matrix"><h3>已存账号</h3><div id="matrix2"></div></div>
    </div>

    <!-- SITES -->
    <div class="body hidden" id="tab-sites">
      <div class="grid" id="siteGrid"></div>
      <div class="matrix">
        <h3>添加站点</h3>
        <form id="siteForm" style="max-width:480px">
          <div class="f"><label>名称</label><input id="sName" placeholder="MyAPI"></div>
          <div class="f"><label>API 地址</label><input id="sUrl" placeholder="https://example.com"></div>
          <div class="f"><label>形态</label><select id="sType"><option value="newapi">newapi(有签到接口)</option><option value="login">login(登录即发额度,每日重登领取)</option></select></div>
          <button class="btn" type="submit">添加站点</button>
          <button class="btn" type="button" id="btnSetup" style="margin-left:8px">载入内置四站</button>
        </form>
      </div>
    </div>

    <!-- LOGS -->
    <div class="body hidden" id="tab-logs">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <select id="logAc" style="width:160px"><option value="">— 选择账号 —</option></select>
        <button class="btn" id="btnLogs">查看使用日志(系统)</button>
        <button class="btn" id="btnHist">查看本地运行日志</button>
      </div>
      <div class="log" id="logBox">暂无日志。先添加账号并粘贴 access_token。</div>
    </div>

    <!-- SETTINGS -->
    <div class="body hidden" id="tab-settings">
      <div class="matrix">
        <h3>引擎设置</h3>
        <form id="setForm">
          <div class="f"><label>SOCKS5 代理 主机</label><input id="sHost"></div>
          <div class="f"><label>SOCKS5 代理 端口</label><input id="sPort"></div>
          <div class="f"><label><input type="checkbox" id="sSchOn" style="width:auto"> 启用定时签到(每天此时刻, Asia/Shanghai)</label></div>
          <div class="f"><label>定时签到时刻</label><input id="sCron" type="time" value="09:05"></div>
          <button class="btn" type="submit">保存</button>
          <button class="btn warn" type="button" id="btnRunNow" style="margin-left:8px">立即跑一轮全部账号</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
const BASE = '/api';
const $ = s => document.querySelector(s);
let CFG = null, TKS = [];

async function api(p, opt) {
  const r = await fetch(BASE + p, opt);
  return r.json();
}

async function refresh() {
  CFG = await api('/config');
  TKS = (await api('/accounts')).tokens || [];
  const cfg = CFG.cfg;
  $('#proxyBadge').textContent = '代理: ' + (cfg.proxy.enabled ? `${cfg.proxy.type}://${cfg.proxy.host}:${cfg.proxy.port}` : '关');
  $('#schBadge').textContent = '调度: ' + (cfg.schedule.enabled ? '每天 ' + (cfg.schedule.time || '?') : '关');
  $('#sumAc').textContent = TKS.length;
  $('#sumSite').textContent = cfg.sites.length;
  $('#sumLogin').textContent = TKS.filter(t => t.token || t.siteCookie).length;

  // 站点下拉
  $('#aSite').innerHTML = cfg.sites.map(s => `<option value="${s.key}">${s.name} (${s.checkinType})</option>`).join('');
  $('#logAc').innerHTML = '<option value="">— 选择账号 —</option>' + TKS.map(t => `<option value="${t.key}">${t.alias || t.key} @ ${t.siteName} (${t.githubAccount || '-'})</option>`).join('');
  // 站点卡片(原版结构)
  $('#siteGrid').innerHTML = cfg.sites.map(s => {
    const mode = s.checkinType === 'login' ? '登录即发额度·每日重登领取' : '需单独签到·全自动';
    return `<div class="card"><div class="lbl">${s.name}</div><div class="val" style="font-size:15px">${mode}</div><div class="lbl">${s.baseUrl}</div></div>`;
  }).join('');
  // 矩阵 + 额度(原版结构)
  const rows = []; const quota = [];
  for (const t of TKS) {
    const site = cfg.sites.find(s => s.key === t.siteKey);
    const login = !!(t.token || t.siteCookie);
    const name = t.alias || t.key;
    rows.push(`<div class="row"><span>${name}</span><span class="lbl" style="flex:1">${site?.name||t.siteKey} · ${t.githubAccount||'-'}</span>
      <span class="chip ${login?'a':'c'}">${login?'已登录':'未授权'}</span>
      <span class="chip ${t.encCredential?'a':'b'}">${t.encCredential?'凭据库✓全自动':'手动模式'}</span>
      <button class="btn sm" data-a="${t.key}">查看额度</button>
      <button class="btn sm" data-f="${t.key}">刷新余额</button>
      <button class="btn sm" data-c="${t.key}">签到</button>
      <button class="btn sm" data-l="${t.key}">查看日志</button>
      <button class="btn sm danger" data-d="${t.key}">删除</button></div>`);
    quota.push(`<div class="card" data-a="${t.key}"><div class="lbl">${name} · ${site?.name||''}</div><div class="lbl">可用额度</div><div class="val" id="q_${t.key}_rem">-</div><div class="lbl">已用额度</div><div class="val warn" id="q_${t.key}_used">-</div><div class="lbl">今日消耗</div><div class="val ok" id="q_${t.key}_bonus">-</div></div>`);
  }
  $('#matrix').innerHTML = rows.join('') || '<div class="row">还没有账号</div>';
  $('#matrix2').innerHTML = rows.join('') || '<div class="row">还没有账号</div>';
  $('#quotaGrid').innerHTML = quota.join('');
  // 事件
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => fetchStatus(b.dataset.a));
  document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => showLogs(b.dataset.l, '系统'));
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { toast('刷新中…'); fetchStatus(b.dataset.f, true); });
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => doCheckin(b.dataset.c));
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => delAccount(b.dataset.d));
  // 设置表单(原版字段)
  $('#sHost').value = cfg.proxy.host; $('#sPort').value = cfg.proxy.port;
  $('#sCron').value = cfg.schedule.time || '09:05';
  $('#sSchOn').checked = !!cfg.schedule.enabled;
}

async function fetchStatus(key, force) {
  const r = await api('/status/' + key + (force ? '?force=1' : ''));
  if (!r.ok) { toast('接口失败: ' + (r.detail || r.error || '')); return; }
  const el1 = $('#q_' + key + '_rem'), el2 = $('#q_' + key + '_used'), el3 = $('#q_' + key + '_bonus');
  if (!r.authorized) {
    if (el1) el1.textContent = '未授权';
    if (el2) el2.textContent = '-';
    if (el3) el3.textContent = '-';
    return;
  }
  if (el1) el1.textContent = '$' + r.availableUSD;
  if (el2) el2.textContent = '$' + r.usedUSD;
  if (el3) el3.textContent = r.todayUsed != null ? '今日 $' + r.todayUsed : '-';
  toast('✔ ' + key + (r.user ? ' @ ' + r.user : '') + '：可用 $' + r.availableUSD + ' / 已用 $' + r.usedUSD);
}

async function doCheckin(key) {
  toast('签到已触发(两级人机验证全自动,失败即报错)…');
  const r = await api('/checkin/' + key, { method:'POST' });
  toast(r.message || JSON.stringify(r));
  fetchStatus(key); refresh();
}

async function delAccount(key) {
  if (!confirm('删除账号 ' + key + '?')) return;
  await api('/accounts/' + key, { method:'DELETE' });
  toast('已删除'); refresh();
}

async function showLogs(key, cat) {
  const r = await api('/logs/' + key + '?category=' + cat + '&limit=50');
  const box = $('#logBox');
  if (!r.ok) { box.innerHTML = '失败: ' + (r.error || r.detail || ''); return; }
  const rows = r.rows || [];
  let html = rows.map(x => `<div><span class="t">[${x.time || ''}]</span> <span class="e">[${x.category}]</span> ${esc(x.text || '')}${x.quota ? ' <b>+$' + (x.quota / 500000).toFixed(4) + '</b>' : ''}</div>`).join('');
  if (r.lastBonus) html = `<div style="color:#6bdf85">🎁 最近签到奖励：[${r.lastBonus.time}] ${esc(r.lastBonus.text || '')}</div><hr style="border:none;border-top:1px solid #252a45;margin:8px 0">` + html;
  box.innerHTML = html || '无记录';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;top:18px;right:18px;background:#1f2550;border:1px solid #252a45;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:999';document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}

/* ---------- 授权(Python 引擎:任务轮询,替代原版 Android/Electron 桥) ---------- */
async function startAuth(mode) {
  const siteKey = $('#aSite').value, gh = $('#aGh').value.trim();
  let accountKey = $('#aKey').value.trim();
  // 别名未存过则先创建账号
  const exists = TKS.find(t => (t.alias || t.key) === accountKey);
  if (!exists && accountKey) {
    await api('/accounts/save', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ siteKey, alias: accountKey, githubAccount: gh || undefined }) });
  } else if (exists) accountKey = exists.key;
  if (!accountKey) { toast('先填账号别名（如 gh1）'); return; }

  if (gh) await api('/accounts/save', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ key: accountKey, siteKey, githubAccount: gh }) });

  const stat = $('#authStat'); stat.classList.remove('hidden');
  if (mode === 'auto') {
    const pw = prompt('GitHub 密码(存入加密凭据库,读不回显):');
    if (!pw) return;
    const totp = prompt('TOTP 密钥(2FA setup key,没有点取消):') || '';
    await api('/credentials/' + accountKey, { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ username: gh || undefined, password: pw, totpSecret: totp || undefined }) });
  }
  const ep = mode === 'auto' ? '/oauth/start' : '/oauth/manual';
  const t = await api(ep, { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ accountKey }) });
  if (!t.task) { toast('发起失败: ' + (t.detail || '')); return; }
  toast(mode === 'auto' ? 'headless 全自动授权中…' : '浏览器已弹出,请手动登录(密码不存储)');
  const tick = async () => {
    const s = await api('/oauth/status?task=' + t.task);
    if (s.state === 'running') {
      stat.innerHTML = '⏳ ' + esc(s.message || '进行中…');
      setTimeout(tick, 3000);
    } else {
      stat.innerHTML = (s.state === 'ok' ? '✅ ' : '❌ ') + esc(s.message || s.state) + (s.login ? ' <b>@' + esc(s.login) + '</b>' : '');
      toast(s.state === 'ok' ? '✅ 授权成功: ' + (s.login || '') : '授权未完成: ' + (s.message || ''));
      refresh();
    }
  };
  tick();
}
$('#btnAuth').onclick = () => startAuth('auto');
$('#btnAuthManual').onclick = () => startAuth('manual');

/* ---------- 表单(原版行为) ---------- */
$('#addForm').onsubmit = async e => {
  e.preventDefault();
  const t = { siteKey: $('#aSite').value, alias: $('#aKey').value.trim(), githubAccount: $('#aGh').value.trim() || undefined, token: $('#aToken').value.trim() || undefined };
  if (!t.alias) { toast('账号别名必填'); return; }
  await api('/accounts/save', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(t) });
  toast('已保存'); $('#aToken').value = ''; refresh();
};
$('#siteForm').onsubmit = async e => {
  e.preventDefault();
  const r = await api('/sites/save', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ name: $('#sName').value, baseUrl: $('#sUrl').value, checkinType: $('#sType').value }) });
  if (r.ok) { toast('站点已添加'); $('#sName').value = ''; $('#sUrl').value = ''; refresh(); }
  else toast(r.detail || r.error);
};
$('#btnSetup').onclick = async () => { await api('/setup', { method:'POST' }); toast('内置四站已载入'); refresh(); };
$('#setForm').onsubmit = async e => {
  e.preventDefault();
  await api('/settings/save', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ proxy: { enabled: CFG.cfg.proxy.enabled, host: $('#sHost').value, port: +$('#sPort').value },
                           schedule: { enabled: $('#sSchOn').checked, time: $('#sCron').value } }) });
  toast('已保存(即时生效)'); refresh();
};
$('#btnRunNow').onclick = async () => {
  const r = await api('/run-all', { method:'POST' });
  toast(r.message || '已触发,看运行日志');
};
$('#btnLogs').onclick = () => { const k=$('#logAc').value; if(!k) toast('先选账号'); else showLogs(k, '系统'); };
$('#btnHist').onclick = async () => { const r=await api('/history'); $('#logBox').innerHTML = (r.data||[]).map(x=>`<div><span class="t">[${x.time}]</span> <span class="e">[${x.site||'-'}]${x.account||''} ${x.event||''}</span> ${(x.detail?JSON.stringify(x.detail):'')}</div>`).join(''); };

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  document.querySelectorAll('[id^="tab-"]').forEach(b=>b.classList.add('hidden'));
  $('#tab-' + t.dataset.tab).classList.remove('hidden');
  $('#title').textContent = t.textContent.trim();
});

$('#btnRefreshAll').onclick = async () => {
  toast('全部余额刷新中(绕过缓存)…');
  for (const t of TKS) if (t.token || t.siteCookie) await fetchStatus(t.key, true);
  toast('✅ 刷新完成');
};

refresh();
</script>
</body>
</html>
